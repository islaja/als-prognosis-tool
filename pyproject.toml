[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "als_prognosis"
version = "0.1.0"
authors = [
  { name="Isabelle Lajoie" },
]
description = "A clinical tool for ALS disease progression subtyping and survival prognosis."
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.2",
    "scikit-survival==0.23.1",
    "statsmodels==0.14.6",
    "nibabel==5.2.1",
    "joblib==1.5.3",
    "dill==0.3.5.1",
    "requests",
    "PyYAML",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["als_prognosis*"]

[tool.setuptools.package-data]
"als_prognosis.backends.pelican" = ["*.sh"]